<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechStore - cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
  </head>
  <body>
    <div class="pagina">

      <aside class="lateral">
        <h2 class="logo">TechStore</h2>
        <h2 class="boas-vindas">Bem-vindo</h2>
      </aside>

      <main class="conteudo">
        <form class="formulario">
          <h1>Crie a sua conta</h1>
          <p class="subtitulo">Preencha seus dados para continuarmos</p>

          <div class="campo">
            <label for="nome">Nome</label>
            <input id="email" type="email" placeholder="digite seu nome completo...">

            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="digite seu email...">
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="sua senha de acesso...">
            <label for="confirmasenha">confirmasenha</label>
            <input id="confirmasenha" type="password" placeholder="Confirme sua senha...">
          </div>

          <div class="termos">
            <label class="termosuso">
              <input type="checkbox">
              termos de uso
            </label>
          </div>

          <button class="criar" type="submit">criar</button>
        </form>
      </main>
    </div>
  </body>
</html>
