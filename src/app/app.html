<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechStore - Entrar</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div class="pagina">

      <aside class="lateral">
        <h2 class="logo">TechStore</h2>
        <h2 class="boas-vindas">Bem-vindo</h2>
      </aside>

      <main class="conteudo">
        <form class="formulario">
          <h1>Entrar na sua conta</h1>
          <p class="subtitulo">Entre com seu e-mail e senha abaixo</p>

          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="digite seu email...">
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="sua senha de acesso...">
          </div>

          <div class="opcoes">
            <label class="lembrar">
              <input type="checkbox">
              Lembrar-me
            </label>
            <a href="#" class="esqueci">Esqueci minha senha</a>
          </div>

          <button class="entrar" type="submit">Entrar</button>
        </form>

        <div class="rodape">
          <p>Não tem uma conta ainda?</p>
          <button class="criar" type="button">Criar nova conta</button>
        </div>
      </main>
 
    </div>
  </body>
</html>
